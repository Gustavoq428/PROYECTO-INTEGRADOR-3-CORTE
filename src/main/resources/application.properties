# --- Aplicación ---
quarkus.application.name=gimnasio-hexagonal
quarkus.banner.enabled=false
quarkus.log.level=INFO
quarkus.http.port=8080

# --- Base de datos MySQL (XAMPP) ---
# La base "gimnasio" se crea sola (createDatabaseIfNotExist=true). Requiere MySQL encendido en XAMPP.
quarkus.datasource.db-kind=mysql
quarkus.datasource.username=root
quarkus.datasource.password=
quarkus.datasource.jdbc.url=jdbc:mysql://localhost:3306/gimnasio?createDatabaseIfNotExist=true

# Crea/actualiza las tablas automáticamente (conserva los datos)
quarkus.hibernate-orm.schema-management.strategy=update
# MariaDB (XAMPP) reporta versión 5.5.5; se desactiva el chequeo de versión
quarkus.hibernate-orm.database.version-check.enabled=false
# Muestra el SQL en consola (útil para explicar en clase)
quarkus.hibernate-orm.log.sql=true

# --- Swagger / OpenAPI ---
quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.info-title=Gimnasio - Planes, inscripciones y pagos
quarkus.smallrye-openapi.info-version=1.0
quarkus.smallrye-openapi.info-description=Recursos web (vistas HTML y reportes PDF) del gimnasio. La aplicación se usa desde el navegador; Swagger documenta los recursos que sirven las páginas.

# --- Datos de prueba ---
# true: al arrancar, si la tabla de planes está vacía, se cargan planes, socios y pagos de ejemplo.
gym.seed.enabled=true
